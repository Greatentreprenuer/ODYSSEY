<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odyssey | Join the Waitlist</title>

    <!-- Fonts & CSS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/reference.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--color-bg);
            text-align: center;
        }

        .waitlist-container {
            max-width: 500px;
            width: 90%;
            padding: var(--spacing-lg);
        }

        .waitlist-title {
            font-family: var(--font-headline);
            font-size: 3rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }

        .waitlist-subtitle {
            margin-bottom: 3rem;
            opacity: 0.7;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        .input-field {
            width: 100%;
            padding: 1rem;
            border: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background: transparent;
            font-family: var(--font-body);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: var(--color-primary);
        }

        .btn-submit {
            width: 100%;
            margin-top: 2rem;
            padding: 1.2rem;
            font-size: 1rem;
        }

        .success-message {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="waitlist-container" id="formContainer">
        <h1 class="waitlist-title">The wait is <em>intentional</em>.</h1>
        <p class="waitlist-subtitle">We’re curating a community of depth. Drop your details to be notified when your
            invitation is ready.</p>

        <div class="input-group">
            <label class="input-label">Your Name</label>
            <input type="text" class="input-field" placeholder="E.g. Julian" id="nameInput">
        </div>

        <div class="input-group">
            <label class="input-label">Email Address</label>
            <input type="email" class="input-field" placeholder="E.g. name@email.com" id="emailInput">
        </div>

        <button class="btn btn-primary btn-submit" id="submitBtn">JOIN THE WAITLIST</button>

        <a href="index.html"
            style="display: block; margin-top: 2rem; font-size: 0.8rem; opacity: 0.5; color: inherit; text-decoration: none;">BACK
            TO HOME</a>
    </div>

    <div class="waitlist-container success-message" id="successContainer">
        <h1 class="waitlist-title">You’re on the list.</h1>
        <p class="waitlist-subtitle">We’ll reach out when the stars align. In the meantime, keep seeking depth.</p>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">BACK TO HUB</button>
    </div>

    <script>
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const name = document.getElementById('nameInput').value;
            const email = document.getElementById('emailInput').value;

            if (name && email) {
                // Show success UI immediately for a seamless feel
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successContainer').style.display = 'block';

                // --- GOOGLE FORM SILENT SUBMISSION ---
                // Replace these placeholders with your actual IDs
                const GFORM_URL = "https://docs.google.com/forms/u/0/d/e/FILL_YOUR_ID_HERE/formResponse";
                const NAME_ENTRY = "entry.YOUR_NAME_ID";
                const EMAIL_ENTRY = "entry.YOUR_EMAIL_ID";

                const formData = new FormData();
                formData.append(NAME_ENTRY, name);
                formData.append(EMAIL_ENTRY, email);

                try {
                    await fetch(GFORM_URL, {
                        method: "POST",
                        body: formData,
                        mode: "no-cors" // Essential to prevent CORS errors with Google Forms
                    });
                    console.log("Waitlist: Data submitted successfully.");
                } catch (error) {
                    // Silently log error, user already sees success message
                    console.error("Waitlist: Submission error", error);
                }

                // Keep backup in local storage
                localStorage.setItem('odysseyWaitlist', JSON.stringify({ name, email }));
            } else {
                alert('Please provide your details.');
            }
        });
    </script>
</body>

</html>
